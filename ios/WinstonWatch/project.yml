name: WinstonWatch
options:
  deploymentTarget:
    watchOS: '10.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: KBGYVG6F36
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
packages:
  WinstonCore:
    path: .
targets:
  WinstonWatch:
    type: application
    platform: watchOS
    sources: [App]
    dependencies:
      - package: WinstonCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnmarshall.winston-watchdog
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        INFOPLIST_KEY_CFBundleDisplayName: Animal Tracker
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to your Animal Tracker backend.
    info:
      path: Config/Watch-Info.plist
      properties:
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Config/Watch.entitlements
      properties:
        com.apple.security.application-groups: [group.com.johnmarshall.winston-watchdog]
  WinstonComplication:
    type: app-extension
    platform: watchOS
    sources: [Complication]
    dependencies:
      - package: WinstonCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnmarshall.winston-watchdog.complication
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
    info:
      path: Config/Complication-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/Complication.entitlements
      properties:
        com.apple.security.application-groups: [group.com.johnmarshall.winston-watchdog]
schemes:
  WinstonWatch:
    build:
      targets:
        WinstonWatch: all
